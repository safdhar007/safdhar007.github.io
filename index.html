<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat 💬</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ece5dd;
}

.chat-container {
  max-width: 400px;
  margin: auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: #efeae2;
}

.header {
  background: #c8eb07;
  color: white;
  padding: 15px;
  font-weight: bold;
}

.chat-box {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

.message {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  max-width: 70%;
}

.bot {
  background: white;
  align-self: flex-start;
}

.user {
  background: #dcf8c6;
  align-self: flex-end;
}

.buttons {
  padding: 10px;
  text-align: center;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
}

.yes {
  background: #25d366;
  color: white;
}

.no {
  background: #ff4d4d;
  color: white;
}
</style>
</head>

<body>

<div class="chat-container">

  <div class="header">Someone Special</div>

  <div class="chat-box" id="chat"></div>

  <div class="buttons" id="buttons" style="display:none;">
    <button class="yes" onclick="yes()">YES 💖</button>
    <button class="no" onclick="no()">NO 😒</button>
  </div>

</div>

<script>

const chat = document.getElementById("chat");
const buttons = document.getElementById("buttons");

let clickedNo = false; // Track NO click

function addMessage(text, type="bot") {
  const msg = document.createElement("div");
  msg.className = "message " + type;
  msg.innerText = text;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function delay(ms) {
  return new Promise(res => setTimeout(res, ms));
}

// Conversation flow
async function startChat() {
  addMessage("Hello NIdha Hameed enthalla👀");
  await delay(1000);

  addMessage("before you scream you need to relax and read the whole message 😅");
  await delay(2200);

  addMessage("Life-il ellathinum oru shemma venam... especially enne deal cheyyumbo 😌");
  await delay(2200);

  addMessage("Please scene aakkaruth 🥲");
  await delay(2200);

  addMessage("I wanted to ask you something...");
  await delay(2200);

  addMessage("I Hope every thing going well for you ...");
  await delay(2200);

  addMessage("Actually it require quite an effort to learn and develop this you know ");
  await delay(2200);

    addMessage("pazhaya developer skill comes handly here, chat gpt vare ente samshayam kette pandaram edangiii 😭");
  await delay(2200);

  addMessage("By the way Sitcoms was nice watch few episodes of big bang theory actually ");
  await delay(2200);

  addMessage("I Know you are angry with me and dont wanna talk with me ....");
  await delay(2200);

  addMessage(" ne No ye paryollu athenikke ariyaam but still i need to ask u this 😅");
  await delay(2200);

  addMessage("Will you come to my engagement? 💍🥹");
  await delay(2200);

  addMessage("Madhi Okke indaavum ");
  await delay(2200);

  addMessage("And Offffff course i will arranege Sign laban too 😁");
  await delay(2200);

  addMessage("Varooo ....");
  await delay(2200);

  addMessage("SCROLL DOWN AND ANSWER THIS QUESTION 😁");
  await delay(2200);

  buttons.style.display = "block";
}

// YES flow
async function yes() {
  addMessage("YES 💖", "user");

  buttons.style.display = "none";
  await delay(1000);

  // Show extra message only if NO was clicked before
  if (clickedNo) {


    addMessage("Aadyam NO adichittu ippo YES oo?!");
    await delay(2000);

    addMessage("Athe venda athe vendaaa.....");
    await delay(2000);

    addMessage("I know you dont have intrest in comming");
    await delay(2000);

    addMessage("Just inform cheyyan venditaanatto ");
    await delay(2000);

  }

  else {

    addMessage("Enthamooooo yesss ooo");
    await delay(2000);

    addMessage("Option maari pooyathonnum allallo alle ");
    await delay(2000);


      addMessage("YAYYYYY 😍🎉");
      await delay(2000);

    addMessage("You just made my day 🥹💖");
    await delay(2000);
  }




  addMessage("📍 Venue: chakkaraparambu co-Operative hall , Kochi");
  await delay(2000);

  addMessage("📅 Date: June 28 😉");
  await delay(2000);

  addMessage("Don't be late... I'm watching you 👀😂");
}

// NO flow
async function no() {
  clickedNo = true; // Mark that NO was clicked

  addMessage("NO 😒", "user");

  buttons.style.display = "none";
  await delay(1000);

  addMessage("...");
  await delay(1500);

  addMessage("typing...");
  await delay(2000);

  addMessage("Answer predictable aayirunnu 😂");
  await delay(2000);

  addMessage("Ente patti varum ennalle ne ippo udesiche  😂");
  await delay(2000);

  addMessage("Actually nee vannillel food waste aavum...");
  await delay(2000);

  addMessage("Mandhii... ninne anveshich karayum 🥺");
  await delay(2100);

  addMessage("Beef curry stove-il irunn emotional aavum 😭");
  await delay(2200);

  addMessage("Padachoone evaroode nan ine enthe paranne ashvasipikkum ... 😭");
  await delay(2200);

  addMessage("And whatever it is oru paade vishamam unde ta dont know how to explain it to you 😅");
  await delay(1500);

  addMessage("Ninte absence-il oru paade vishamam undu ta 😭");
  await delay(2000);

  addMessage("Hey put some smile on that beautiful face atleast 😌");
  await delay(2000);
 
  addMessage("allenkilum paavapetaavaroode panakarkke ennu pucham aane kuyapilladi na sahichuu 😌");
  await delay(2000);

  addMessage("Appo nan poote chettane block aakilekkil adutha udaayip aayitte varam 😂");
  await delay(2000);

  addMessage("Oru retry koode tharatte? 😌");
  await delay(2000);

  buttons.style.display = "block";
}

// Start
startChat();


</script>

</body>
</html>
